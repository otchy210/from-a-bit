# Exact capacities are quoted decimal strings. Both languages share this order.
- id: bit
  kind: capacity
  capacityBits: "1"
  graphic:
    src: graphics/bit.svg
  sources: []
  text:
    ja:
      heading:
        - すべては、
        - ひとつのビットから。
      description:
        - 1 bit は、0 と 1。
        - 二つの状態の、どちらか一つを表します。
    en:
      heading:
        - It all starts
        - with a single bit.
      description:
        - One bit represents one of two states.
        - 0 or 1. This is where our journey begins.

- id: byte
  kind: capacity
  capacityBits: "8"
  graphic:
    src: graphics/byte.svg
  sources: []
  text:
    ja:
      heading:
        - 8 bit で、
        - 1 byte。
      description:
        - 八つのビットをひとまとまりにした単位です。
        - このサイトでは、1 byte = 8 bit として進みます。
    en:
      heading:
        - 8 bits.
        - 1 byte.
      description:
        - Eight bits together make one byte.
        - Throughout this journey, 1 byte means 8 bits.

# A narrative placeholder, not a storage medium with a capacity.
- id: storage
  kind: outlook
  sources: []
  text:
    ja:
      heading:
        - 記憶は、
        - どこまで広がるだろう。
      description:
        - パンチカードから、大容量のストレージへ。
        - 媒体の歴史をたどりながら、容量の違いを同じ尺度で眺めていきます。
      note: >-
        ただいま制作中。記憶媒体の紹介は、これから追加します。
    en:
      heading:
        - How far
        - can memory grow?
      description:
        - From punched cards to vast data stores.
        - Follow the history of storage and compare its capacity on a shared scale.
      note: >-
        A work in progress. Storage milestones are coming next.
