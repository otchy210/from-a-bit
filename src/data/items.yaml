    - label: "Microsoft：媒体形式"
      url: "https://learn.microsoft.com/en-us/windows/win32/api/winioctl/ne-winioctl-media_type"

- id: ibm-350
  kind: capacity
  capacityBits: "30000000"
  graphic:
    src: graphics/ibm-350.svg
  text:
    heading:
      - "世界初の商用ハードディスク"
    era: "1956年 · IBM 350初出荷"
    capacity: "3.75 MB相当／ドライブ"
    description:
      - >-
        IBM 350は、IBM 305 RAMACのためのハードディスクでした。回転する円盤に500万文字を記憶できました。
  sources:
    - label: "CHM：RAMAC"
      url: "https://www.computerhistory.org/storageengine/first-commercial-hard-disk-drive-shipped/"
    - label: "IBM：RAMAC"
      url: "https://www.ibm.com/history/ramac"

- id: st-506
  kind: capacity
  capacityBits: "40000000"
  graphic:
    src: graphics/st-506.svg
  text:
    heading:
      - "PCに入るハードディスク"
    era: "1980年 · Seagate ST-506／1983年 · Rodimeの3.5型"
    capacity: "5 MB／ドライブ"
    description:
      - >-
        SeagateのST-506は、5.25インチのドライブに5 MBを収めました。Rodimeはさらに小さい3.5型を導入し、デスクトップPCで馴染みのある形へとつながります。
  sources:
    - label: "CHM：ST-506研究ノート"
      url: "https://s3.computerhistory.org/groups/ds-seagate-st-506.pdf"
    - label: "CHM：Rodime研究ノート"
      url: "https://s3.computerhistory.org/groups/rodime-ro352.pdf"

- id: sd-card
  kind: capacity
  capacityBits: "64000000"
  graphic:
    src: graphics/sd-card.svg
  text:
    heading:
      - "指先に載るメモリーカード"
    era: "1998年 · Memory Stick発売／2000年 · 初期SD登場"
    capacity: "8 MB／カード1枚"
    description:
      - >-
        初期のSDカードは8 MB。ソニーのメモリースティックも4 MBと8 MBで登場しました。カードを差し替えれば、デジタルカメラなどで記録する場所を手軽に増やせます。
  sources:
    - label: "SD Association：初期カードの説明"
      url: "https://www.sdcard.org/press/thoughtleadership/anatomy-of-an-sd-memory-card-what-matters-most-for-photography-and-videography/"
    - label: "Sony：発売発表"
      url: "https://www.sony.com/en/SonyInfo/News/Press/199807/98-067/"
    - label: "公式20年史"
      url: "https://www.sdcard.org/pdf/SDA20thAnniversary_Infographic.pdf"

- id: prairietek-220
  kind: capacity
  capacityBits: "160000000"
  graphic:
    src: graphics/prairietek-220.svg
  text:
    heading:
      - "ノートPCへの2.5型HDD"
    era: "1988年 · PrairieTek 220登場"
    capacity: "20 MB／ドライブ"
    description:
      - >-
        PrairieTek 220は2.5インチのハードディスク。20 MBの記憶装置を小さく、軽くすることで、ハードディスクを持ち運ぶパソコンに収めやすくしました。
  sources:
    - label: "CHM：小型HDD"
      url: "https://www.computerhistory.org/storageengine/miniature-disk-drives-enable-mobile-computing/"

- id: sundisk-ssd
  kind: capacity
  capacityBits: "160000000"
  graphic:
    src: graphics/sundisk-ssd.svg
  text:
    heading:
      - "回転しない20 MB"
    era: "1991年 · SunDiskがIBM向けに納入"
    capacity: "20 MB／ドライブ"
    description:
      - >-
        SunDiskはIBM向けに20 MBのフラッシュSSDを納入しました。前の2.5型HDDと容量は同じ。磁気ディスクとヘッドを半導体に置き換えた例です。
  sources:
    - label: "Eli Harari：2011年IMW論文"
