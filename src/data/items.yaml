    - label: "CHM：SSD"
      url: "https://www.computerhistory.org/storageengine/solid-state-drive-module-demonstrated/"

- id: winchester
  kind: capacity
  capacityBits: "280000000"
  graphic:
    src: graphics/winchester.svg
  text:
    heading:
      - "密閉型HDDへの転換点"
    era: "1973年 · IBM 3340／3348導入"
    capacity: "35 MB／モジュール"
    description:
      - >-
        IBMのWinchester方式は、ディスクとヘッドをまとめたモジュールを採用。35 MB版と70 MB版がありました。小さな間隔でヘッドを動かす技術は、後のHDDにつながります。
  sources:
    - label: "CHM：Winchester"
      url: "https://www.computerhistory.org/storageengine/winchester-pioneers-key-hdd-technology/"
    - label: "CHM：ディスクパック"
      url: "https://www.computerhistory.org/storageengine/disk-packs-offer-portability-security/"

- id: zip-100
  kind: capacity
  capacityBits: "800000000"
  graphic:
    src: graphics/zip-100.svg
  text:
    heading:
      - "フロッピーの先にあったZip"
    era: "1994年 · Iomega Zip発表"
    capacity: "100 MB／ディスク"
    description:
      - >-
        Zipは厚みのある交換式メディアに100 MBを収めました。複数枚のフロッピーに分けていたファイルをまとめて持ち運ぶ用途に使われました。
  sources:
    - label: "CHM：minifloppy"
      url: "https://www.computerhistory.org/storageengine/minicomputers-stimulate-floppy-disk-sales/"

