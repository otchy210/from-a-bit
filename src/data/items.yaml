# 容量順。capacityBits は縮尺に用いる十進の整数文字列。
# 公称値や換算の条件は site.yaml のフッター注記に記載する。

- id: bit
  kind: capacity
  capacityBits: "1"
  graphic:
    src: graphics/bit.svg
  text:
    heading:
      - "すべては、"
      - "ひとつのビットから。"
    era: "1946年 · CRTを使った記憶実験"
    capacity: "1 bit"
    description:
      - >-
        1 bit は、0 と 1 のどちらか一つを表します。1946年、ウィリアムズはブラウン管の画面に電荷を残し、1 bitを記憶する実験を行いました。
  sources:
    - label: "Manchester：Baby開発史"
      url: "https://curation.cs.manchester.ac.uk/computer50/www.computer50.org/mark1/new.baby.html"
    - label: "CHM：CRT記憶"
      url: "https://www.computerhistory.org/storageengine/williams-demonstrates-crt-storage/"

- id: byte
  kind: capacity
  capacityBits: "8"
  graphic:
    src: graphics/byte.svg
  text:
    heading:
      - "8 bit で、"
      - "1 byte。"
    era: "単位の定義"
    capacity: "1 B（8 bit）"
    description:
      - >-
        8ビットをひとまとまりにすると1バイトです。例えば、「あ」の1文字はUTF-8で3バイト。文字を保存するときの大きさは、文字と符号化の方式で決まります。
  sources:
    - label: "Unicode公式FAQ"
      url: "https://www.unicode.org/faq/utf_bom.html"

- id: intel-3101
  kind: capacity
  capacityBits: "64"
  graphic:
    src: graphics/intel-3101.svg
  text:
    heading:
      - "Intelの最初のメモリ"
    era: "1969年4月 · Intel 3101発売"
    capacity: "8 B／チップ"
    description:
      - >-
        Intelが最初に売り出した製品は、64 bitのSRAMでした。4 bitのデータを16組記憶し、電源を切ると中身は失われます。
  sources:
    - label: "Intel：3101"
      url: "https://www.intel.com/content/www/us/en/history/virtual-vault/articles/intels-first-product-3101.html"
    - label: "Intel：3101データシート"
      url: "https://bitsavers.trailing-edge.com/components/intel/_dataBooks/1978_Intel_Component_Data_Catalog.pdf"

- id: early-rom
  kind: capacity
  capacityBits: "256"
  graphic:
    src: graphics/early-rom.svg
  text:
    heading:
      - "半導体に固定した32バイト"
    era: "1965年 · Sylvaniaの初期半導体ROM"
    capacity: "32 B／チップ"
    description:
      - >-
        Sylvaniaが製作した256 bitの初期の半導体ROM。読み出し専用のデータをチップに組み込む方式です。初期の半導体ROMには、その後に登場したMOS方式など複数の系譜があります。
  sources:
    - label: "CHM：半導体ROM"
      url: "https://www.computerhistory.org/siliconengine/semiconductor-read-only-memory-chips-appear/"

- id: punch-card
  kind: capacity
  capacityBits: "640"
  graphic:
    src: graphics/punch-card.svg
  text:
    heading:
      - "穴で読む80文字"
    era: "1928年 · IBMの80欄形式"
    capacity: "80 B相当／カード1枚"
    description:
      - >-
        IBMのパンチカードは、縦に並ぶ穴の組み合わせで、1欄に1文字、カード1枚で80文字を表しました。1890年の米国国勢調査にも、別形式のパンチカードが使われています。
  sources:
    - label: "IBM：パンチカード"
      url: "https://www.ibm.com/history/punched-card"
    - label: "米国国勢調査局"
      url: "https://www.census.gov/programs-surveys/decennial-census/decade/1890/about-1890.html"

- id: manchester-baby
  kind: capacity
  capacityBits: "1024"
  graphic:
    src: graphics/manchester-baby.svg
  text:
    heading:
      - "ブラウン管が主記憶だった"
    era: "1948年 · Manchester Babyがプログラムを実行"
    capacity: "128 B／主記憶"
    description:
      - >-
        Babyはブラウン管に32 bitの語を32個記憶できました。同じ1,024 bitでも、1953年の磁気コアはコア面1枚、1970年のIntel 1103はDRAMチップ1個。コアは電源を切っても磁化を保ち、DRAMは定期的な再書き込みを必要とします。
  sources:
    - label: "Manchester：Baby開発史"
      url: "https://curation.cs.manchester.ac.uk/computer50/www.computer50.org/mark1/new.baby.html"
    - label: "CHM：Whirlwind"
      url: "https://www.computerhistory.org/storageengine/whirlwind-computer-debuts-core-memory/"
    - label: "CHM：SRAMからDRAMへ"
      url: "https://www.computerhistory.org/siliconengine/mos-dynamic-ram-competes-with-magnetic-core-memory-on-price/"

- id: eprom-1702
  kind: capacity
  capacityBits: "2048"
  graphic:
    src: graphics/eprom-1702.svg
  text:
    heading:
      - "窓から光を当てて消すROM"
    era: "1971年 · Intel 1702発表"
    capacity: "256 B／チップ"
    description:
      - >-
        2,048 bitを記憶するIntel 1702には、紫外線を通す窓がありました。書き込んだ内容を紫外線で消去し、プログラムを入れ直せます。後のEEPROMでは、消去も電気的に行えるようになります。
  sources:
    - label: "CHM：プログラマブルROM"
      url: "https://www.computerhistory.org/siliconengine/reusable-programmable-rom-introduces-iterative-design-flexibility/"
    - label: "Intel 1983 Memory Component Handbook"
      url: "https://www.bitsavers.org/components/intel/_dataBooks/1983_Memory_Component_Handbook.pdf"

- id: magnetic-drum
  kind: capacity
  capacityBits: "500000"
  graphic:
    src: graphics/magnetic-drum.svg
  text:
    heading:
      - "回転する磁気ドラム"
    era: "1932年 · Tauschekが実演／1933年 · 特許出願"
    capacity: "62.5 KB／試作機"
    description:
      - >-
        磁性体で覆った円筒を回し、ヘッドで記録を読み取る装置です。
  sources:
    - label: "CHM：磁気ドラム"
      url: "https://www.computerhistory.org/storageengine/tauschek-patents-magnetic-drum-storage/"

- id: apollo-rope
  kind: capacity
  capacityBits: "552960"
  graphic:
    src: graphics/apollo-rope.svg
  text:
    heading:
      - "月へ行ったコアロープROM"
    era: "1966年 · 設計資料／1969年 · 月着陸で使用"
    capacity: "69.12 KB／ROM"
    description:
      - >-
        アポロ誘導コンピューターの固定メモリでは、磁気コアを通る線の配線でプログラムを表しました。Block IIのROMには36,864語を記憶できました。
  sources:
    - label: "NASA NTRS：1966年設計資料"
      url: "https://ntrs.nasa.gov/api/citations/19660019469/downloads/19660019469.pdf"

- id: early-floppy
  kind: capacity
  capacityBits: "640000"
  graphic:
    src: graphics/early-floppy.svg
  text:
    heading:
      - "最初期のフロッピー"
    era: "1971年 · IBM 23FD／1976年 · Shugart SA400"
    capacity: "80 KB／8インチディスク"
    description:
      - >-
        最初期のIBM 23FDは読み出し専用の8インチフロッピーで、装置にデータを読み込ませるために使われました。後に登場した5.25インチのSA400は、約89.6 KBを収めました。
  sources:
    - label: "CHM：最初のFD"
      url: "https://www.computerhistory.org/storageengine/floppy-disk-loads-mainframe-computer-data/"
    - label: "IBM：開発史"
      url: "https://www.ibm.com/history/floppy-disk"
    - label: "CHM：minifloppy"
      url: "https://www.computerhistory.org/storageengine/minicomputers-stimulate-floppy-disk-sales/"

- id: pc-floppy
  kind: capacity
  capacityBits: "2949120"
  graphic:
    src: graphics/pc-floppy.svg
  text:
    heading:
      - "PCで使われたフロッピー"
    era: "1981年 · ECMA-70初版、Sony 3.5型発売／1984年 · Mac採用"
    capacity: "360 KiB／両面"
    description:
      - >-
        PC向けの5.25インチフロッピーには、両面で360 KiBを収める形式がありました。国内の2Dは320 KiB、Sonyの初期3.5型は322.5 KB、初期Macは400 KiBでした。
  sources:
    - label: "ECMA-70"
      url: "https://ecma-international.org/publications-and-standards/standards/ecma-70/"
    - label: "Microsoft：媒体形式"
      url: "https://learn.microsoft.com/en-us/windows/win32/api/winioctl/ne-winioctl-media_type"
    - label: "Sony OEM manual"
      url: "https://bitsavers.org/pdf/sony/floppy/Sony_Micro_Floppy_Disk_Drive_Model_0A-D30V_OEM_Manual_Mar82.pdf"
    - label: "Apple：Macintosh 512K仕様"
      url: "https://support.apple.com/en-us/112187"

- id: first-nand
  kind: capacity
  capacityBits: "4194304"
  graphic:
    src: graphics/first-nand.svg
  text:
    heading:
      - "初代NANDフラッシュ"
    era: "1987年 · 東芝が研究発表／1991年 · 製品化"
    capacity: "512 KiB／チップ"
    description:
      - >-
        東芝が製品化した初代NANDフラッシュの公称容量は4 Mbitでした。電源を切ってもデータが残り、まとめて読み書きする用途に向きます。読み出しの自由度を重視するNORとは用途が分かれ、のちにメモリーカードやSSDの土台になりました。
  sources:
    - label: "KIOXIA：技術開発史"
      url: "https://www.kioxia.com/ja-jp/rd/technology/history.html"
    - label: "Intel開発者の口述記録"
      url: "https://archive.computerhistory.org/resources/access/text/2012/04/102658199-05-01-acc.pdf"
    - label: "KIOXIA：初代NANDの製品化（英語版年表）"
      url: "https://www.kioxia.com/en-jp/rd/technology/history.html"

- id: kokoro
  kind: capacity
  capacityBits: "4476096"
  graphic:
    src: graphics/kokoro.svg
  text:
    heading:
      - "小説1冊、あるいは新聞1日"
    era: "1914年 · 『こころ』連載／2026年 · 電子版を計測"
    capacity: "559.512 KB／『こころ』の電子版"
    description:
      - >-
        夏目漱石の『こころ』の電子版は、新聞1日分の文字データとおおよそ同じ大きさです。新聞1日分の目安は約465 KBです。
  sources:
    - label: "図書カード・初出年"
      url: "https://www.aozora.gr.jp/cards/000148/card773.html"
    - label: "授業リポート"
      url: "https://oshihaku.jp/teacher/classreport/14754625"

- id: floppy-2dd
  kind: capacity
  capacityBits: "5898240"
  graphic:
    src: graphics/floppy-2dd.svg
  text:
    heading:
      - "2DDのフロッピー"
    era: "1985年 · ECMA-100初版／1986年 · Macintosh Plus発売"
    capacity: "720 KiB／両面"
    description:
      - >-
        両面倍密度の3.5型フロッピーでは、PC向けの720 KiBが一つの代表例。国内の640 KiB形式やMacの800 KiB形式もあり、見た目が同じでもドライブや書式によって読み書きできる形式が変わります。
  sources:
    - label: "ECMA-100"
      url: "https://ecma-international.org/publications-and-standards/standards/ecma-100/"
    - label: "Microsoft：媒体形式"
      url: "https://learn.microsoft.com/en-us/windows/win32/api/winioctl/ne-winioctl-media_type"
    - label: "Apple：Macintosh Plus仕様"
      url: "https://support.apple.com/en-ae/112183"

- id: floppy-2hd
  kind: capacity
  capacityBits: "11796480"
  graphic:
    src: graphics/floppy-2hd.svg
  text:
    heading:
      - "2HDのフロッピー"
    era: "1984年 · PC/ATで高密度形式採用／1987年 · ECMA-125初版"
    capacity: "1,440 KiB／両面"
    description:
      - >-
        3.5型の「1.44 MB」フロッピーは1,440 KiBを収めました。5.25型のPC/ATでは1,200 KiB、国内PCで使われた3.5型の別形式では1,232 KiBでした。
  sources:
    - label: "ECMA-125"
      url: "https://ecma-international.org/publications-and-standards/standards/ecma-125/"
    - label: "IBMサービスマニュアル"
